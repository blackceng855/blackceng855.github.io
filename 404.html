<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面走丢了 | blackceng的小窝</title>
    <meta name="robots" content="noindex">
    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #2c3038;
            --sub: #8a92a6;
            --accent: #00a596;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1f26;
                --card: #262a33;
                --text: #e6e8eb;
                --sub: #8f96a3;
                --accent: #00c9b7;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            padding: 24px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, .07);
        }
        .code {
            font-family: "Fira Code", monospace;
            font-size: 96px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -4px;
            color: var(--accent);
            margin-bottom: 12px;
        }
        h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        p { color: var(--sub); font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block;
            padding: 11px 26px;
            border-radius: 10px;
            font-size: 14px;
            text-decoration: none;
            transition: transform .2s, opacity .2s;
        }
        a:hover { transform: translateY(-2px); opacity: .88; }
        .primary { background: var(--accent); color: #fff; }
        .ghost { background: transparent; color: var(--sub); border: 1px solid rgba(140, 148, 166, .35); }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>这条路上没有火车</h1>
        <p>你要找的页面不存在，可能是链接过期了，或者我把它删了。</p>
        <div class="btns">
            <a class="primary" href="/">回到首页</a>
            <a class="ghost" href="/archives/">翻翻归档</a>
        </div>
    </div>
</body>
</html>
